# 雲端智學 — nginx 反向代理設定
#
# 安裝：
#   sudo cp deploy/nginx/yunzhi.conf /etc/nginx/sites-available/yunzhi
#   sudo ln -s /etc/nginx/sites-available/yunzhi /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 或用腳本（會自動代入 APP_DOMAIN 並驗證）：
#   sudo ./deploy/scripts/setup-nginx.sh
#
# 前提：.env 設定 PROXY_MODE=external，讓應用只綁在 127.0.0.1:3000，
# 不自行處理 TLS，也不佔用 80／443。

# ── 速率限制 ────────────────────────────────────────────────────
# 放在 http 區塊層級。若你的 nginx.conf 已有同名 zone，改個名字。
# 登入端點特別限制，因為那是唯一值得暴力嘗試的地方；
# 一般頁面的限制放寬，否則全班同時交卷會被自己的防護擋下來。
limit_req_zone $binary_remote_addr zone=yunzhi_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=yunzhi_general:10m rate=30r/s;

upstream yunzhi_app {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;

    # 多實例時在這裡加。應用本身無狀態（session 存資料庫），
    # 所以不需要 sticky session。
    # server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;

    keepalive 64;
}

# ── HTTP → HTTPS ────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yunzhi.example.edu.tw;

    # certbot 的驗證路徑要放行
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 主站 ────────────────────────────────────────────────────────
server {
    # HTTP/2 的寫法在 nginx 1.25.1 前後不同：
    #   < 1.25.1   listen 443 ssl http2;
    #   >= 1.25.1  listen 443 ssl;  加上獨立的 http2 on;
    # 這裡用舊寫法，因為它在新版仍然有效（只會有一則棄用警告），
    # 反過來則會在 Ubuntu 22.04／24.04 的 nginx 上直接 emerg 起不來。
    # setup-nginx.sh 會偵測版本並自動改寫成該版本的建議寫法。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yunzhi.example.edu.tw;

    # ── TLS ─────────────────────────────────────────────────────
    # certbot 產生的路徑。內網自簽請改成你自己的憑證位置。
    ssl_certificate     /etc/letsencrypt/live/yunzhi.example.edu.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yunzhi.example.edu.tw/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:YunzhiSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── 安全標頭 ────────────────────────────────────────────────
    #
    # X-Frame-Options: DENY 這一條**不是可有可無的**。防作弊的
    # 全螢幕鎖定與焦點偵測（規格書文件 04 的瀏覽器層）全部可以
    # 用 iframe 包起來繞過 —— 少了它，考試模式的鎖定形同虛設。
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # ── 上傳大小 ────────────────────────────────────────────────
    # 老師上傳的掃描題本可能是幾十 MB 的 PDF。
    # nginx 預設 1M，不改的話匯入功能會直接壞掉，
    # 而且錯誤訊息是 413，看不出來是哪一層擋的。
    client_max_body_size 200M;
    client_body_timeout 300s;
    client_body_buffer_size 1M;

    # ── 逾時 ────────────────────────────────────────────────────
    # 考試場次是長連線；題本解析的 API 回應也可能很慢。
    # 預設 60 秒對這套系統太短。
    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ── 壓縮 ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/x-javascript image/svg+xml
               application/manifest+json;

    # ── 共用的 proxy 標頭 ───────────────────────────────────────
    # $proxy_add_x_forwarded_for 讓應用取得真實來源 IP。
    # 這對稽核記錄是必要的 —— 沒有它，所有稽核事件的來源 IP
    # 都會是 127.0.0.1，誠信事件調查時等於沒有資訊。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ── 健康檢查（不記日誌）────────────────────────────────────
    # 每 15 秒一次的探測會把 access log 塞滿，
    # 讓真正的錯誤淹沒在裡面。
    location ~ ^/api/(healthz|readyz)$ {
        proxy_pass http://yunzhi_app;
        access_log off;
        proxy_read_timeout 10s;
    }

    # ── 智慧老師的串流回應 ──────────────────────────────────────
    #
    # SSE 必須關閉緩衝，否則 nginx 會把整段回應收完才吐出來，
    # 學生看到的是「轉圈圈 20 秒然後一次跳出全部文字」——
    # 那會讓對話式教學的體感完全消失。
    location /api/tutor/stream {
        proxy_pass http://yunzhi_app;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        add_header X-Accel-Buffering "no" always;
    }

    # ── 登入（防暴力嘗試）───────────────────────────────────────
    location ~ ^/api/auth/(callback|signin) {
        limit_req zone=yunzhi_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://yunzhi_app;
    }

    # ── Next.js 靜態資源 ────────────────────────────────────────
    # 檔名含內容雜湊，可以長期快取。
    location /_next/static/ {
        proxy_pass http://yunzhi_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── 題本圖片等物件 ──────────────────────────────────────────
    location /api/files/ {
        proxy_pass http://yunzhi_app;
        proxy_buffering on;
        proxy_max_temp_file_size 0;
    }

    # ── 其餘 ────────────────────────────────────────────────────
    location / {
        limit_req zone=yunzhi_general burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://yunzhi_app;

        # WebSocket 升級（目前未用，但監考事件通道日後可能會用）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ── 維護模式 ────────────────────────────────────────────────
    # upgrade.sh 會建立 /opt/yunzhi/.maintenance。
    # 讓使用者看到「系統升級中」而不是 502。
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/yunzhi;
        internal;
    }

    access_log /var/log/nginx/yunzhi-access.log;
    error_log  /var/log/nginx/yunzhi-error.log warn;
}

# WebSocket 升級用的 map。放在 http 區塊層級；
# 若 nginx.conf 已定義過同名 map，把這段刪掉。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
