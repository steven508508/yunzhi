global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: yunzhi-web
    metrics_path: /api/metrics
    static_configs: [{targets: ['web:3000']}]
  - job_name: yunzhi-ai
    static_configs: [{targets: ['ai:8000']}]
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
