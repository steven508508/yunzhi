# 雲端智學 — 告警規則
#
# ⚠ **這個檔案目前沒有任何有效的規則，而且那是刻意的。**
#
# 這裡原本有六條規則，讀起來很完整：服務不可用、資料庫連線數逼近
# 上限、磁碟超過 85%、WAL 歸檔失敗、備份超過 26 小時未執行、還原
# 演練過期。實際情況是——
#
#   · 五條引用的指標**沒有任何東西產生**：pg_stat_activity_count 要
#     postgres_exporter、node_filesystem_avail_bytes 要 node_exporter、
#     yunzhi_last_backup_timestamp_seconds 要應用自己吐 /metrics。
#     compose 裡這三樣都沒有。規則不會報錯，只是永遠不成立。
#   · 唯一求得出值的 `up{job=~"yunzhi.*"} == 0` **永遠成立**，因為
#     被抓取的那兩條路由不存在（見 prometheus.yml）。
#   · 就算某一條成立了，compose 裡沒有 Alertmanager，**沒有任何東西
#     會被送到任何地方**。.env 的 ALERT_WEBHOOK_URL 標著【尚未實作】。
#
# 也就是說，這份檔案先前的作用是讓人以為告警已經涵蓋了那五件事。
# 一個裝了但什麼都不會通知的監控，比沒有監控更危險：它會讓人不再
# 自己去看。所以規則全部留在下面當註解，等對應的元件真的裝上去
# 再一條一條打開，而不是掛著假裝有。
#
# **現在真正在做這件事的是 ./deploy/scripts/doctor.sh。**
# 它會實際連資料庫、數最新備份的年齡、讀備份守護行程留下的失敗原因、
# 看還原演練紀錄。要「自動」的話，把它排進 cron 並把輸出寄給自己：
#
#   # /etc/cron.d/yunzhi-doctor
#   30 7 * * * root /opt/yunzhi/deploy/scripts/doctor.sh || \
#     mail -s "雲端智學健康檢查有紅燈" 你的信箱@example.com
#
# doctor.sh 有紅燈時回傳非零，所以上面那行只在出事時寄信。
#
# ── 要把下面打開之前，需要先有的東西 ──────────────────────────
#   postgres_exporter   → 資料庫連線數、WAL 歸檔失敗
#   node_exporter       → 磁碟
#   web 的 /api/metrics → 備份時間戳、演練時間戳、服務存活
#   Alertmanager ＋ 一個收件端 → 讓上面任何一條真的送得出去
#
# 四樣缺一，那一組規則就不要打開——寧可維持「這裡是空的」這個
# 誠實的狀態，也不要再有一次「指示燈全綠但其實沒人在看」。

groups:
  - name: yunzhi
    rules: []

