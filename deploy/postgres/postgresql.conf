# 雲端智學 — PostgreSQL 設定
#
# 基準：4 核 8GB、300 人同時作答。
# 調整前請看 docs/OPERATIONS.md 的容量規劃。
#
# 這份設定的重點是 WAL 歸檔 —— 它是 RPO 15 分鐘這個承諾的
# 唯一實作方式。只有每日 pg_dump 的話，機器在下午五點掛掉
# 就會掉掉整個下午的作答資料，而那正好是補習班的尖峰時段。

# ── 連線 ────────────────────────────────────────────────────
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 5

# ── 記憶體 ──────────────────────────────────────────────────
shared_buffers = 512MB
effective_cache_size = 2GB
maintenance_work_mem = 128MB
work_mem = 8MB
# 300 連線 × 8MB 在最壞情況下是 2.4GB，加上 shared_buffers
# 仍在 8GB 之內。調高 work_mem 之前先想清楚這個乘法。

# ── WAL 與時間點還原 ────────────────────────────────────────
wal_level = replica
archive_mode = on
# 歸檔命令。%p 是待歸檔檔案路徑，%f 是檔名。
# test ! -f 是必要的 —— 沒有它，重複歸檔會靜默覆蓋，
# 而覆蓋掉的那一段 WAL 在還原時就是一個永遠補不回的洞。
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 900          # 15 分鐘強制切換 WAL，這就是 RPO 的上限
max_wal_size = 2GB
min_wal_size = 512MB
wal_compression = on
checkpoint_completion_target = 0.9

# ── 查詢規劃 ────────────────────────────────────────────────
random_page_cost = 1.1         # SSD；傳統硬碟改回 4.0
effective_io_concurrency = 200
default_statistics_target = 100

# ── 平行查詢 ────────────────────────────────────────────────
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ── 自動清理 ────────────────────────────────────────────────
# ResponseEvent 與 ProctorEvent 寫入量很大，預設的 autovacuum
# 門檻會讓它們累積過多死列，查詢隨學期進展越來越慢。
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ── 日誌 ────────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000   # 記錄超過 1 秒的查詢
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 10MB
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'Asia/Taipei'

# ── 語系與時區 ──────────────────────────────────────────────
timezone = 'Asia/Taipei'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.simple'

# ── 統計 ────────────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# ── 安全 ────────────────────────────────────────────────────
password_encryption = scram-sha-256
ssl = off
# 容器內部網路不啟用 SSL。若 Postgres 與應用跨主機部署，
# 這裡必須改為 on 並提供憑證，否則資料庫密碼在網路上是明文。
