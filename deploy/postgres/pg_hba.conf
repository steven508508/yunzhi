# 雲端智學 — PostgreSQL 連線認證
#
# 這份檔案存在的唯一理由是**讓備份能取得實體基礎備份**。
#
# 官方 postgres 映像的進入點會在資料目錄裡自動產生一份 pg_hba.conf，
# 內容大致是「local 全部 trust ＋ host all all all scram-sha-256」。
# 那一份對日常使用完全夠用，但它有一個看不出來的洞：
#
#   **資料庫欄位寫 `all` 的規則不匹配「複製連線」（replication）。**
#
# 而 pg_basebackup —— 唯一能產生「可以重放 WAL 的實體基礎備份」的工具
# —— 走的正是複製連線。於是備份容器一跑 pg_basebackup 就會拿到
#   FATAL: no pg_hba.conf entry for replication connection from host …
# 也就是說，在補上下面那兩行 replication 規則之前，**這套系統宣稱的
# 「RPO 15 分鐘、可指定時間點還原」在技術上是做不到的**：只有每日的
# 邏輯 dump（pg_dump），而邏輯 dump 上面是沒有辦法重放 WAL 的。
#
# 為什麼用 hba_file 掛一份，而不是在 deploy/postgres/init/ 放一支
# 附加規則的初始化腳本：初始化腳本**只在資料目錄是空的時候跑一次**。
# 已經裝好在跑的機器不會執行它，於是那些機器的備份會繼續少一半，
# 而且沒有任何訊息。掛檔案則是重啟就生效，新舊機器一致。
#
# 代價寫在這裡：這份檔案取代了映像自動產生的那一份，所以
# POSTGRES_HOST_AUTH_METHOD 這個環境變數對本系統不再有作用。
# 要改認證方式請直接改這裡。
#
# 欄位：類型  資料庫        使用者      來源位址        認證方式

# 容器內部的 unix socket。映像原本就是 trust，這裡維持一致 ——
# 進得了容器的人本來就等於拿到整台資料庫，收緊這一行只會讓
# 官方進入點的初始化與 deploy/scripts/*.sh 全部連不上。
local   all             all                                     trust

# 同上，但給複製連線用。宿主機上手動跑 ./deploy/scripts/backup.sh 時，
# pg_basebackup 是在 postgres 容器裡走 socket 出去的，靠的是這一行。
local   replication     all                                     trust

# 應用容器（web／worker／migrate）與備份容器都在 internal 網路上，
# 而那張網路沒有對外路由、postgres 也不發布任何主機埠，所以來源
# 位址寫 all 的實際範圍就是這一組容器。密碼一律走 scram-sha-256。
host    all             all             all                     scram-sha-256

# **這一行就是實體基礎備份的開關。** 拿掉它，備份容器每晚仍然會
# 產出一份 tarball、doctor.sh 也仍然全綠，只是那份 tarball 裡不再有
# base/ 目錄 —— 而缺了它，誤刪成績那天沒有任何辦法回到中午十二點。
host    replication     all             all                     scram-sha-256
