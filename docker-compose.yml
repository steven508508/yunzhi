# 雲端智學 — 生產環境堆疊
#
# 啟動：  ./deploy/scripts/docker-install.sh
# 手動：  docker compose --env-file .env up -d
# 監控：  docker compose --profile monitoring up -d
#
# 設計原則：
#   1. 每個服務都有 healthcheck，且 depends_on 用 service_healthy —
#      否則 web 會在 Postgres 還沒起來時就嘗試連線並崩潰重啟。
#   2. 只有 Caddy 對外開埠。其餘服務走內部網路，不 publish。
#      要從外面連 Postgres 除錯，用 deploy/scripts/db-shell.sh。
#   3. 所有服務都設記憶體上限。沒有上限時 AI 服務解析大型 PDF
#      會把整台機器吃垮，連帶讓正在考試的學生斷線。
#   4. 日誌一律限制大小。磁碟寫滿是自架環境最常見的當機原因。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-100m}
    max-file: "${LOG_MAX_FILE:-5}"

x-restart: &default-restart
  restart: unless-stopped

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    # 沒有對外路由。資料庫、Redis、物件儲存只在這張網路上，
    # 就算 web 容器被打穿也沒有跳板可用。
    internal: true
  egress:
    # **需要打外部 API 的服務要另外掛這一張。**
    # AI 服務只掛 internal 的話，一填真的 API 金鑰，每一次匯入、
    # 解析、評分都會以連線錯誤失敗——而 AI_PROVIDER=mock 時一切
    # 正常，所以裝機驗收看不出來。
    # 這張網路不發布任何埠，只是給出去的路。
    driver: bridge

volumes:
  postgres-data:
  postgres-wal:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  loki-data:

services:
  # ────────────────────────────────────────────────────────────
  # 反向代理與 TLS
  # ────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2.8-alpine
    container_name: yunzhi-caddy
    # PROXY_MODE=external 時完全不啟動這個服務 —— 機器上已有 nginx，
    # 兩個東西搶 80／443 只會讓兩邊都壞掉。安裝腳本依 PROXY_MODE
    # 決定要不要帶 --profile caddy。
    profiles: ["caddy"]
    <<: *default-restart
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      TLS_MODE: ${TLS_MODE:-internal}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Caddyfile 不支援條件式，所以整個 tls 指示詞在這裡展開。
      # internal → 本地 CA；custom → 自備憑證路徑；
      # 其餘（public）→ 空字串，交給 Caddy 自動向 Let's Encrypt 申請。
      TLS_DIRECTIVE: >-
        ${TLS_DIRECTIVE:-internal}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/certs:/etc/caddy/certs:ro
      # 維護頁。升級時 upgrade.sh 在這裡 touch .maintenance，
      # 學生就會看到「你先前的作答已經儲存」而不是 502。
      - ./deploy/caddy/maintenance:/srv/maintenance:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - internal
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ────────────────────────────────────────────────────────────
  # 主應用
  # ────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: yunzhi/web:${APP_VERSION:-dev}
    <<: *default-restart
    logging: *default-logging
    environment:
      # **對外的 web 容器不整份載入 .env。** 它拿得到
      # BACKUP_ENCRYPTION_KEY 的話，行程一旦被打穿，攻擊者不只
      # 拿到資料庫，還拿到解開所有加密備份（含全體學生個資）的
      # 金鑰。所以這裡逐項列出它真正需要的。
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?connection_limit=${DATABASE_POOL_MAX:-20}&pool_timeout=20
      REDIS_URL: redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}
      AI_SERVICE_URL: http://ai:8000
      HOSTNAME: "0.0.0.0"
      APP_URL: ${APP_URL}
      APP_VERSION: ${APP_VERSION:-dev}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_SESSION_MAX_AGE: ${AUTH_SESSION_MAX_AGE:-43200}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      AI_PRICING: ${AI_PRICING:-}
      TZ: ${TZ:-Asia/Taipei}
    # PROXY_MODE=external 時對外開一個 loopback 埠給既有的 nginx 用。
    # caddy 模式下 WEB_BIND 留空，這個 mapping 就不會生效。
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_BIND_PORT:-3000}:3000"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      # **預設必須是 1。** 上面的 ports 是無條件發布固定主機埠的
      # （`${WEB_BIND:-127.0.0.1}` 對空字串也會取預設值，所以
      # 「留空就不生效」是做不到的），第二個容器 bind 會失敗，
      # 於是安裝、升級、回滾、還原的每一次 app_start 都起不來。
      # 需要多實例又要用外部 nginx 時，見 docs/INSTALL.md 的
      # 「外部代理 ＋ 多實例」一節。
      replicas: ${WEB_REPLICAS:-1}
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-1g}
    healthcheck:
      # readyz 會實際打資料庫與 Redis；healthz 只回答「行程還活著」。
      # 這裡用 readyz，因為 Caddy 不該把流量送到連不上資料庫的實例。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ────────────────────────────────────────────────────────────
  # 資料庫遷移（一次性，web 依賴它成功完成）
  #
  # 獨立成一個 service 而不是塞進 web 的 entrypoint，是為了讓
  # 多個 web replica 不會同時跑 migration 互相打架。
  # ────────────────────────────────────────────────────────────
  migrate:
    image: yunzhi/web:${APP_VERSION:-dev}
    container_name: yunzhi-migrate
    restart: "no"
    logging: *default-logging
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    command: ["node", "scripts/migrate-and-seed.mjs"]
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}

  # ────────────────────────────────────────────────────────────
  # 背景工作者（匯入、評分、解析生成、通知）
  # ────────────────────────────────────────────────────────────
  worker:
    image: yunzhi/web:${APP_VERSION:-dev}
    <<: *default-restart
    logging: *default-logging
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?connection_limit=5
      REDIS_URL: redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}
      AI_SERVICE_URL: http://ai:8000
    command: ["node", "scripts/worker.mjs"]
    # 關機時給 worker 把手上的工作做完的時間。預設 10 秒就 SIGKILL，
    # 而一份 200 頁的題本要跑一個小時——升級時被砍掉的匯入會因為
    # BullMQ 的鎖過期而 stalled 重派，從 fromStage 整段重跑，也就是
    # 「同一份題本被解析兩次、付兩次錢」。
    # systemd 版本給的是 TimeoutStopSec=60，這裡對齊。
    stop_grace_period: 60s
    networks:
      - internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-1g}
    healthcheck:
      # 檢查**新鮮度**而不是存在性。worker 啟動時就寫了這個檔，
      # 之後每個 tick 覆寫；只檢查存在的話，Redis 連線永久斷開或
      # tick 卡在某個查詢時，佇列停止消費而健康狀態一直是綠的，
      # 老師只看到匯入進度條轉三小時。
      test: ["CMD", "node", "-e", "const t=+require('fs').readFileSync('/tmp/worker-alive');process.exit(Date.now()-t<120000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # Python AI 服務
  #
  # 故障隔離的主要理由：題本解析是長時間、高記憶體、可能崩潰的
  # 工作，關在獨立容器裡崩潰不會影響正在進行的考試。
  # ────────────────────────────────────────────────────────────
  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: yunzhi/ai:${APP_VERSION:-dev}
    container_name: yunzhi-ai
    <<: *default-restart
    logging: *default-logging
    env_file: .env
    networks:
      - internal
      # 模型 API 在外面。少了這一張，AI_PROVIDER 一改成 anthropic
      # 或 openai 就全部連線失敗。
      - egress
    volumes:
      # 嵌入模型的快取。不掛出來的話每次重建容器都要重新下載 2GB。
      - ./data/models:/models
    depends_on:
      # AI 服務直接讀寫物件儲存（題本原稿進、頁面影像出），
      # 所以它必須等 MinIO 起來。少了這一行，重啟後的第一份
      # 匯入會以一個看起來像 AI 故障的錯誤失敗。
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${AI_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ────────────────────────────────────────────────────────────
  # PostgreSQL
  # ────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yunzhi-postgres
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-wal:/var/lib/postgresql/wal_archive
      - ./deploy/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    shm_size: 256mb
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # Redis
  # ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: yunzhi-redis
    <<: *default-restart
    logging: *default-logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ────────────────────────────────────────────────────────────
  # MinIO 物件儲存
  # ────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: yunzhi-minio
    <<: *default-restart
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_BROWSER: "off"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ────────────────────────────────────────────────────────────
  # 監控（--profile monitoring）
  # ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: yunzhi-prometheus
    profiles: ["monitoring"]
    <<: *default-restart
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.2.0
    container_name: yunzhi-grafana
    profiles: ["monitoring"]
    <<: *default-restart
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${APP_URL}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    networks:
      - internal
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.1.1
    container_name: yunzhi-loki
    profiles: ["monitoring"]
    <<: *default-restart
    logging: *default-logging
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    networks:
      - internal

  # ────────────────────────────────────────────────────────────
  # 備份排程
  #
  # 跑在容器裡而不是宿主機 crontab，理由是解除安裝時只要移除
  # 容器就乾淨了，不會在宿主機留下孤兒 cron job —— 那是自架
  # 系統移除後最常見的殘留物。
  # ────────────────────────────────────────────────────────────
  backup:
    image: yunzhi/backup:${APP_VERSION:-dev}
    build:
      context: ./deploy/backup
      dockerfile: Dockerfile
    container_name: yunzhi-backup
    <<: *default-restart
    logging: *default-logging
    env_file: .env
    environment:
      PGHOST: ${POSTGRES_HOST}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ${BACKUP_DIR:-./data/backups}:/backups
      # **不可以是 :ro**。歸檔目錄必須有人清：archive_timeout=900
      # 保證每 15 分鐘至少一個 16MB 段，只增不減的話一個學期就把
      # 磁碟撐爆，而 Postgres 寫不進去等於補習班停業。
      - postgres-wal:/wal_archive
      # 字形對照快取。重裝後歸零的話，每一家出版社的自製符號字型
      # 都要重新付費問一次視覺模型。
      - ./data/models:/models:ro
    networks:
      # 物件儲存與資料庫都在 internal 上；備份要能連到 MinIO。
      - internal
      # 異地備份要出得去。與資料庫同一顆磁碟上的備份，
      # 在磁碟故障時會一起陪葬。
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # 檢查**新鮮度**而不是存在性。存在性檢查對「行程卡死但檔案
      # 還在」永遠是綠的——那正是最需要被發現的情況。
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(cat /tmp/backup-daemon-alive 2>/dev/null || echo 0) )) -lt 300"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
